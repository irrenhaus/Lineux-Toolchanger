[gcode_macro BTC_LED_TOOL_ERROR_HIGHLIGHT]
gcode:
  {% set error_tool = params.TOOL|default(0)|int %}
  {% for toolnumber in printer["gcode_macro _btc_Variables"].numoftool %}
    {% set toolvar = printer["gcode_macro _Variables_t" + toolnumber|string] %}

    {% if toolnumber|int != error_tool %}
      {% set leds = toolvar.leds_toolhead|string %}
      _BTC_LED_SET_INDICES LED=status_led{toolnumber} INDICES={leds} RED=1 GREEN=0 BLUE=0 TRANSMIT=1 SYNC=0 WHITE=0
      {% set leds = toolvar.leds_nozzle|string %}
      _BTC_LED_SET_INDICES LED=status_led{toolnumber} INDICES={leds} RED=0 GREEN=0 BLUE=0 TRANSMIT=1 SYNC=0 WHITE=0
    {% endif %}
  {% endfor %}

  {% set toolvar = printer["gcode_macro _Variables_t" + error_tool|string] %}
  {% set leds = toolvar.leds_nozzle|string %}
  _BTC_LED_SET_INDICES LED=status_led{error_tool} INDICES={leds} RED=1 GREEN=0 BLUE=0 TRANSMIT=1 SYNC=0 WHITE=0
  {% set leds = toolvar.leds_toolhead|string %}
  _BTC_LED_SET_INDICES LED=status_led{error_tool} INDICES={leds} RED=1 GREEN=0 BLUE=0 TRANSMIT=1 SYNC=0 WHITE=0
  
