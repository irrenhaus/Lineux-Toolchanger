[gcode_macro _BTC_LED_SET_INDICES]
gcode:
  {% set indices = params.INDICES|default("")|string %}
  {% set indices = indices.split(",") %}
  {% set led = params.LED|string %}
  {% set RED = params.RED|int %}
  {% set GREEN = params.GREEN|int %}
  {% set BLUE = params.BLUE|int %}
  {% set TRANSMIT = params.TRANSMIT|int %}
  {% set SYNC = params.SYNC|int %}
  {% set WHITE = params.WHITE|int %}

  {% for idx in indices %}
#    { action_respond_info("SET_LED LED=%s INDEX=%s RED=%s GREEN=%s BLUE=%s TRANSMIT=%s SYNC=%s WHITE=%s" % (led, idx, RED, GREEN, BLUE, TRANSMIT, SYNC, WHITE)) }
    SET_LED LED={led} INDEX={idx} RED={RED} GREEN={GREEN} BLUE={BLUE} TRANSMIT={TRANSMIT} SYNC={SYNC} WHITE={WHITE}
  {% endfor %}

[gcode_macro BTC_LED_STATUS_ACTIVE]
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set toolvar = printer["gcode_macro _Variables_t" + tool|string] %}
  {% set leds = toolvar.leds_toolhead|string %}
  {% if 'gcode_macro BTC_LED_STATUS_ACTIVE_USER' in printer %}
    BTC_LED_STATUS_ACTIVE_USER LED=status_led{tool}
  {% else %}
    _BTC_LED_SET_INDICES LED=status_led{tool} INDICES={leds} RED=0 GREEN=1 BLUE=0 TRANSMIT=1 SYNC=0 WHITE=0
  {% endif %}

